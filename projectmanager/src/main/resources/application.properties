spring.application.name=projectmanager
server.port=${PORT:8070}

# Local MySQL by default. Docker Compose and deployments override these
# through DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/projectmanager?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
# The JSON responses read lazy collections (sprints, tasks, tags) after the
# service call returns, so the session stays open for the whole request.
spring.jpa.open-in-view=true

# Errors go out as a short JSON message, never as a stack trace.
server.error.include-stacktrace=never
server.error.include-message=always

# Comma-separated list of front-end origins allowed to call the API.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Fills an empty database with a small example workspace on first start.
app.demo-data=${DEMO_DATA:true}
