spring.application.name=projectmanager
#spring.datasource.url=jdbc:mysql://localhost:3306/projectmanager
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/projectmanager
spring.datasource.url=jdbc:mysql://mysql-container:3306/projectmanager
spring.datasource.username=root
spring.datasource.password=
server.port=8070
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.check-template-location=false
# Configuration du dialecte Hibernate pour MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spécification explicite du pilote JDBC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
