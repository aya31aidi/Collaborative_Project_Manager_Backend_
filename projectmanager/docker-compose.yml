# docker compose up --build
# API on http://localhost:8070, MySQL on localhost:3307 (3307 so it does not
# clash with a local MySQL or XAMPP already using 3306).
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-projectmanager}
      MYSQL_DATABASE: projectmanager
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-projectmanager}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/projectmanager
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-projectmanager}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "8070:8070"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
