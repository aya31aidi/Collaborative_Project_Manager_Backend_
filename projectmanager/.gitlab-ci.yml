stages:
  - build
  - test
  - deploy

# Étape de construction du projet Spring Boot
build:
  stage: build
  image: maven:3.8.4-openjdk-17
  script:
    - mvn clean install 
  artifacts:
    paths:
      - target/projectmanager-0.0.1-SNAPSHOT.jar

# Étape des tests unitaires
test:
  stage: test
  image: maven:3.8.4-openjdk-17
  script:
    - mvn test
  artifacts:
    paths:
      - target/test-classes/
      - target/test-logs/

# Étape de déploiement avec Docker
deploy:
  stage: deploy
  script:
    - docker build -t backend-image .
    - docker run -d -p 9090:8080 backend-image
