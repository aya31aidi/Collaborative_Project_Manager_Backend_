stages:
  - install
  - test
  - build
  - deploy

variables:
  DOCKER_REGISTRY: registry.gitlab.com
  BACKEND_IMAGE: $DOCKER_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME-backend
  BACKEND_IMAGE_TAG: latest

# Étape d'installation des dépendances
install_dependencies:
  stage: install
  image: maven:3.8.4-openjdk-11
  script:
    - echo "Installation des dépendances..."
    - mvn clean install -DskipTests

# Étape des tests unitaires
run_tests:
  stage: test
  image: maven:3.8.4-openjdk-11
  script:
    - echo "Exécution des tests unitaires..."
    - mvn test

# Étape de construction de l'image Docker pour le backend
build_backend_image:
  stage: build
  image: docker:latest
  services:
    - docker:19.03.12-dind
  script:
    - echo "Construction de l'image Docker pour le backend..."
    - docker build -t $BACKEND_IMAGE:$BACKEND_IMAGE_TAG .
    - docker tag $BACKEND_IMAGE:$BACKEND_IMAGE_TAG $DOCKER_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME-backend:$CI_COMMIT_SHA

# Étape de déploiement de l'image Docker
deploy_backend:
  stage: deploy
  image: docker:latest
  script:
    - echo "Déploiement de l'image Docker pour le backend..."
    - docker push $BACKEND_IMAGE:$BACKEND_IMAGE_TAG
    - docker push $DOCKER_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME-backend:$CI_COMMIT_SHA
  only:
    - master
