stages:
  - build
  - test
  - deploy

# Étape de construction du projet Spring Boot
build:
  stage: build
  image: maven:3.8.4-openjdk-17
  script:
    - mvn clean install -DskipTests=true
  artifacts:
    paths:
      - target/

# Étape des tests unitaires
test:
  stage: test
  image: maven:3.8.4-openjdk-17
  script:
    - mvn test
  artifacts:
    paths:
      - target/test-classes/
      - target/test-logs/

# Étape de déploiement (optionnelle)
deploy:
  stage: deploy
  script:
    - echo "Déploiement sur votre serveur"
    - echo "Déploiement Spring Boot"




